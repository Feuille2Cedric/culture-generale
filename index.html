<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#244c3b"><title>Curio — Culture générale</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="stylesheet" href="./style.css?v=20260912-editor"><script src="./categories.js" defer></script><script src="./supplements.js?v=20260912-books" defer></script><link rel="stylesheet" href="./sync/sync.css"><script src="./sync/config.js" defer></script><script src="./sync/supabase.js" defer></script><script src="./sync/auth.js" defer></script><script src="./sync/sync.js" defer></script><script src="./sync/adapter.js" defer></script><script src="./app.js?v=20260912-editor" defer></script><script src="./editor-tools.js?v=20260912-editor" defer></script></head>
<body>
<aside class="sidebar">
  <a class="brand" href="./">curio<span>✳</span></a><p class="brand-caption">UN PEU PLUS CURIEUX, CHAQUE JOUR.</p>
  <button id="home" class="nav active">◫ &nbsp; Ma bibliothèque</button><button id="favorites" class="nav">☆ &nbsp; Mes favoris</button>
  <div class="section-label">MES SUJETS <button id="add-topic-side" aria-label="Créer un sujet">+</button></div><nav id="topics"></nav>
  <div class="sidebar-bottom"><p>Ton petit monde de connaissances.</p><button id="export" class="nav">↓ &nbsp; Exporter ma bibliothèque</button><button id="import" class="nav">↑ &nbsp; Importer une sauvegarde</button><button id="repair-topics" class="nav" onclick="repairDuplicateTopics()">Regrouper les sujets en double</button><span id="save-status" role="status">Chargement…</span></div>
</aside>
<main>
  <header><div class="breadcrumb" id="breadcrumb">Mon espace / Bibliothèque</div><div class="header-controls"><label id="sort-control" class="sort-control">Trier<select id="sort-order" aria-label="Ordre de tri"><option value="az">A → Z</option><option value="za">Z → A</option><option value="recent">Plus récents</option></select></label><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Rechercher dans mes connaissances…" aria-label="Rechercher"></label></div></header>
  <div id="notice" role="alert" hidden></div><section id="view"></section>
</main>
<dialog id="topic-dialog"><form id="topic-form"><span class="eyebrow">UNE NOUVELLE CURIOSITÉ</span><h2 id="dialog-title">Créer un sujet</h2><label>Nom du sujet<input name="title" required maxlength="100" placeholder="Ex. Civilisations anciennes"></label><label>Une petite description<textarea name="description" rows="3" maxlength="300" placeholder="Ce que tu aimerais explorer…"></textarea></label><label>Couleur<select name="color"><option value="sage">Sauge</option><option value="sand">Sable</option><option value="blue">Bleu</option><option value="rose">Rose</option><option value="lavender">Lavande</option></select></label><div class="dialog-actions"><button type="button" id="cancel-dialog" class="secondary">Annuler</button><button class="primary">Enregistrer</button></div></form></dialog>
<input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<dialog id="category-dialog"><form id="category-form"><span class="eyebrow">UNE PLACE POUR CHAQUE DÉCOUVERTE</span><h2 id="category-dialog-title">Créer une sous-catégorie</h2><label for="category-name">Nom de la sous-catégorie</label><input id="category-name" required maxlength="100" placeholder="Ex. Acteurs, Films, Albums…"><div class="dialog-actions"><button id="category-cancel" type="button" class="secondary">Annuler</button><button type="submit" class="primary">Enregistrer</button></div></form></dialog>
<input id="import-input" type="file" accept="application/json,.json" hidden>
</body></html>
