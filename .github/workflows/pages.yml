name: Deploy Curio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html app.js categories.js supplements.js style.css favicon.svg _site/
          mkdir _site/sync
          cp sync/config.js sync/auth.js sync/supabase.js sync/sync.js sync/adapter.js sync/sync.css _site/sync/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
